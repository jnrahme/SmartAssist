name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-binaries:
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: darwin-arm64
            python: '3.12'
          - os: ubuntu-latest
            target: linux-amd64
            python: '3.12'

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install nuitka ordered-set zstandard
          pip install .

      - name: Build with Nuitka
        run: |
          python -m nuitka \
            --standalone \
            --onefile \
            --output-filename=smartassist-${{ matrix.target }} \
            --include-package=smartassist \
            --include-package=mcp \
            --nofollow-import-to=tests \
            --assume-yes-for-downloads \
            smartassist/cli.py

      - name: Verify binary
        run: |
          chmod +x smartassist-${{ matrix.target }}
          ./smartassist-${{ matrix.target }} version

      - uses: actions/upload-artifact@v4
        with:
          name: smartassist-${{ matrix.target }}
          path: smartassist-${{ matrix.target }}

  create-release:
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir release-assets
          for dir in artifacts/smartassist-*/; do
            cp "$dir"/* release-assets/ 2>/dev/null || true
          done
          chmod +x release-assets/*
          ls -la release-assets/

      - name: Determine if prerelease
        id: prerelease
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          if [[ "$TAG" == *"-beta"* ]] || [[ "$TAG" == *"-alpha"* ]] || [[ "$TAG" == *"-rc"* ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
            echo "Prerelease: $TAG"
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
            echo "Stable release: $TAG"
          fi

      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          prerelease: ${{ steps.prerelease.outputs.is_prerelease == 'true' }}

  publish-npm:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Determine npm tag
        id: npm-tag
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          if [[ "$TAG" == *"-beta"* ]]; then
            echo "tag=beta" >> $GITHUB_OUTPUT
          elif [[ "$TAG" == *"-alpha"* ]]; then
            echo "tag=alpha" >> $GITHUB_OUTPUT
          elif [[ "$TAG" == *"-rc"* ]]; then
            echo "tag=rc" >> $GITHUB_OUTPUT
          else
            echo "tag=latest" >> $GITHUB_OUTPUT
          fi

      - name: Publish to npm
        working-directory: npm-package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm publish --access public --tag ${{ steps.npm-tag.outputs.tag }}

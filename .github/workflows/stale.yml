name: Stale Triage

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest

    steps:
      - name: Mark inactive triage items as stale
        uses: actions/stale@v10
        with:
          any-of-issue-labels: "needs-info,stale-candidate"
          any-of-pr-labels: "stale-candidate"
          stale-issue-label: "stale"
          stale-pr-label: "stale"
          days-before-issue-stale: 21
          days-before-issue-close: 7
          days-before-pr-stale: 30
          days-before-pr-close: -1
          stale-issue-message: >-
            This issue has been inactive while waiting on follow-up. It will be
            closed in 7 days unless there is new activity. If it is still
            relevant, comment with an update and the stale label will clear.
          close-issue-message: >-
            Closing because this issue was waiting on follow-up and stayed
            inactive. Reopen or start a new issue when you have the missing
            context.
          stale-pr-message: >-
            This pull request has been inactive for 30 days. It is marked stale
            for maintainer review, but it will not be auto-closed. Comment or
            push updates to clear the stale label.
          exempt-issue-labels: >-
            good first issue,help wanted,bug,feedback,setup,community
          exempt-pr-labels: "good first issue,help wanted"
          exempt-draft-pr: true
          remove-stale-when-updated: true
          operations-per-run: 100

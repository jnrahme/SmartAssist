name: QA Harness

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa-harness:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Install pipx
        run: python -m pip install pipx

      - name: Compile check
        run: python -m compileall -q smartassist tests

      - name: Run QA shell-script dry runs
        run: |
          bash scripts/qa_autodiagnose.sh --dry-run --max-attempts 2 --run-dir qa-artifacts/autodiagnose-dry-run
          bash scripts/qa_package_smoke.sh --dry-run
          bash scripts/qa_pipx_smoke.sh --dry-run
          bash scripts/qa_claude_headless_smoke.sh --dry-run

      - name: Validate QA workflow tests
        run: uv run pytest -q tests/test_qa_workflow.py

      - name: Run deterministic QA scenario suite
        run: |
          uv run python -m smartassist.cli qa run --run-dir qa-artifacts/ci-demo
          uv run python -m smartassist.cli qa demo --run-dir qa-artifacts/ci-demo --output qa-artifacts/ci-demo/index.html

      - name: Upload QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-artifacts
          path: qa-artifacts/**

      - name: Upload Pages artifact
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v3
        with:
          path: qa-artifacts/ci-demo

      - name: Publish QA summary
        if: always()
        run: |
          echo "## QA Harness Summary" >> "$GITHUB_STEP_SUMMARY"
          if [ -f qa-artifacts/ci-demo/summary.txt ]; then
            cat qa-artifacts/ci-demo/summary.txt >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No deterministic QA summary file generated." >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy-demo:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: qa-harness
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy QA demo to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

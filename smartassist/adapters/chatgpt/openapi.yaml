openapi: 3.1.0
info:
  title: SmartAssist Memory API
  version: 1.1.0
  description: |
    AI memory system that learns from developer feedback.
    Captures lessons, ranks them with Thompson Sampling, and injects
    the best ones into every prompt automatically.
servers:
  - url: http://localhost:3333
    description: Local SmartAssist MCP server (start with smartassist serve)
paths:
  /rag_search:
    post:
      operationId: ragSearch
      summary: Search project knowledge base
      description: Search for relevant lessons and past corrections before writing code.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query:
                  type: string
                  description: Natural language search query
                top_k:
                  type: integer
                  default: 5
                category:
                  type: string
      responses:
        '200':
          description: Search results with relevance scores

  /create_lesson:
    post:
      operationId: createLesson
      summary: Create a new lesson
      description: Save a project-specific lesson directly. Prefer `apply_feedback_protocol` for live feedback because it handles duplicate checks and overlap first.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lesson, category]
              properties:
                lesson:
                  type: string
                  description: Imperative statement (>30 chars)
                category:
                  type: string
                sentiment:
                  type: string
                  enum: [positive, negative]
                intensity:
                  type: integer
                context:
                  type: string
      responses:
        '200':
          description: Lesson created with ID

  /compare_lesson:
    post:
      operationId: compareLesson
      summary: Draft a lesson for A/B comparison
      description: Create a comparison-only lesson draft without storing it in the active knowledge base.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lesson, category]
              properties:
                lesson:
                  type: string
                  description: Imperative statement (>30 chars)
                category:
                  type: string
                sentiment:
                  type: string
                  enum: [positive, negative]
                context:
                  type: string
      responses:
        '200':
          description: Comparison draft logged without mutating active retrieval state

  /apply_feedback_protocol:
    post:
      operationId: applyFeedbackProtocol
      summary: Apply the SmartAssist feedback workflow
      description: Normalize a user feedback event, check for duplicates or overlap, boost existing lessons when they already exist, suggest merges when multiple lessons overlap, and create a new lesson only when needed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [feedback]
              properties:
                feedback:
                  type: string
                  description: The user's correction, praise, or project rule
                sentiment:
                  type: string
                  enum: [positive, negative]
                category:
                  type: string
                intensity:
                  type: integer
                context:
                  type: string
      responses:
        '200':
          description: Protocol result describing whether SmartAssist created, boosted, ignored, or suggested a merge

  /rag_feedback:
    post:
      operationId: ragFeedback
      summary: Record feedback on suggestions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [helpful]
              properties:
                helpful:
                  type: boolean
                category:
                  type: string
                notes:
                  type: string
      responses:
        '200':
          description: Feedback recorded

  /rag_dashboard:
    get:
      operationId: ragDashboard
      summary: View reliability scores and stats
      responses:
        '200':
          description: Dashboard data

  /boost_lesson:
    post:
      operationId: boostLesson
      summary: Boost a lesson's priority
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lesson_id]
              properties:
                lesson_id:
                  type: string
      responses:
        '200':
          description: Lesson boosted

  /demote_lesson:
    post:
      operationId: demoteLesson
      summary: Demote a lesson's priority
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lesson_id]
              properties:
                lesson_id:
                  type: string
      responses:
        '200':
          description: Lesson demoted

  /merge_lessons:
    post:
      operationId: mergeLessons
      summary: Merge overlapping lessons
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lesson_ids, new_lesson, category]
              properties:
                lesson_ids:
                  type: string
                  description: "Comma-separated lesson IDs to merge (for example: L001,L002,L003)"
                new_lesson:
                  type: string
                category:
                  type: string
      responses:
        '200':
          description: Lessons merged

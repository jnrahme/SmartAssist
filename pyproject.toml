[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smartassist"
version = "1.1.0b1"
description = "Portable RAG learning system for Claude Code — works on any codebase"
readme = "README.md"
requires-python = ">=3.10"
license = "BUSL-1.1"
authors = [{name = "Joey Rahme"}]
keywords = ["claude-code", "claude", "mcp", "rag", "rlhf", "learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "mcp>=1.0.0,<2",
    "sentence-transformers>=3.0.0,<4",
    "lancedb>=0.15.0,<1",
]

[project.urls]
Homepage = "https://github.com/jnrahme/SmartAssist"
Repository = "https://github.com/jnrahme/SmartAssist"
Documentation = "https://github.com/jnrahme/SmartAssist#readme"
Issues = "https://github.com/jnrahme/SmartAssist/issues"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
smartassist = "smartassist.cli:main"
claude-sa = "smartassist.claude_sa:main"
codex-sa = "smartassist.codex_sa:main"
smartassist-prompt-inject = "smartassist.hooks.prompt_inject:main"
smartassist-session-start = "smartassist.hooks.session_start:main"
smartassist-session-end = "smartassist.hooks.session_end:main"
smartassist-commit-hook = "smartassist.hooks.commit_hook:main"
smartassist-show-lessons = "smartassist.hooks.show_lessons:main"
smartassist-monitor = "smartassist.monitor:main"
smartassist-codex-sync = "smartassist.codex_activity:main"

[tool.setuptools.packages.find]
include = ["smartassist*"]
